name: Deploy landing to GitHub Pages
# Landing estática explicativa (web/), sin build. Ver CONVENCIONES-APPS §1.2.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar meta de commit
        run: |
          COMMIT=${GITHUB_SHA::7}
          sed -i "s|</head>|  <meta name=\"commit\" content=\"$COMMIT\" />\\n</head>|" web/index.html
      # EL HASH DEL BUILD A LA VISTA (CONVENCIONES §3). Una landing estática no tiene build
      # donde inyectarlo, así que lo pone el propio despliegue: es el único que sabe de qué
      # commit sale lo que se sube. Sin esto no hay forma de comprobar qué versión sirve el
      # dominio, que es justo lo que hace falta cuando el borde o un service worker
      # devuelven una copia vieja.
      - name: Sellar el commit en la página
        run: |
          sed -i "s|</head>|  <meta name=\"commit\" content=\"${GITHUB_SHA::7}\">\n</head>|" web/index.html
          grep -o 'name="commit" content="[^"]*"' web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
